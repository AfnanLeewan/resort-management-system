server {
    listen 8000;
    server_name _;

    # -----------------------------------------------
    # PostgREST  →  /rest/v1/
    # -----------------------------------------------
    location /rest/v1/ {
        # Strip the /rest/v1 prefix before forwarding to PostgREST
        rewrite ^/rest/v1/(.*)$ /$1 break;
        proxy_pass         http://supabase-rest:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header apikey            $http_apikey;
        proxy_set_header Prefer            $http_prefer;
        proxy_set_header Content-Profile   $http_content_profile;
        proxy_set_header Accept-Profile    $http_accept_profile;

        # CORS headers
        add_header Access-Control-Allow-Origin  "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, apikey, Content-Type, Prefer, Accept, Accept-Profile, Content-Profile, Range, X-Client-Info" always;
        add_header Access-Control-Expose-Headers "Content-Range, Range, X-Total-Count" always;
        add_header Access-Control-Allow-Credentials "true" always;
    }

    # CORS pre-flight for /rest/v1/
    location = /rest/v1/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "$http_origin";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, apikey, Content-Type, Prefer, Accept, Accept-Profile, Content-Profile, Range, X-Client-Info";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            return 204;
        }
        rewrite ^/rest/v1/(.*)$ /$1 break;
        proxy_pass http://supabase-rest:3000;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header apikey        $http_apikey;
    }

    # -----------------------------------------------
    # Health check endpoint
    # -----------------------------------------------
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
