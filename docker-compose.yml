version: '3.8'

services:
  # Resort Management System - Frontend Application
  resort-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
        - VITE_DEMO_MODE=${VITE_DEMO_MODE:-false}
    container_name: resort-management-system
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - resort-network
    labels:
      - "com.resort.description=Royyan Resort Management System"
      - "com.resort.version=0.1.0"

networks:
  resort-network:
    driver: bridge